<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habesha Eatery Contact Page</title>
</head>
<body>

    <header>
        <h1>Habesha Eatery</h1>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="contact.html">Contact & Location</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Us</h2>
            <p>Have a question or want to book a table? Send us a message below.</p>

            <form action="#" method="post">
                    <p>
                        <label for="username">Full Name:</label><br>
                        <input type="text" id="username" name="username" required>
                    </p>

                    <p>
                        <label for="useremail">Email Address:</label><br>
                        <input type="email" id="useremail" name="useremail" required>
                    </p>
                
                    <p>
                        <label for="message">Your Message:</label><br>
                        <textarea id="message" name="message" rows="4" required></textarea>
                    </p>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Habesha Eatery. All rights reserved.</p>
    </footer>

</body>
</html>
