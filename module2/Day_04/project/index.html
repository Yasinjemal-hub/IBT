<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Real Layout Rebuild</title>
  <link rel="stylesheet" href="layout.css">
</head>
<body>

  <div class="app">
    <header class="header">
      <div class="logo">Dashboard</div>
      <nav class="navbar">
        <a href="#">Overview</a>
        <a href="#">Settings</a>
      </nav>
    </header>

    <aside class="sidebar">
      <ul class="nav-links">
        <li><a href="#">Link 1</a></li>
        <li><a href="#">Link 2</a></li>
        <li><a href="#">Link 3</a></li>
      </ul>
    </aside>

    <main class="main">
      <h2>Main Content Area</h2>
      
      <div class="card-grid">
        <div class="card popular-card">
          <span class="badge">New</span>
          <h3>Stat Card 1</h3>
          <p>Important layout metrics data.</p>
        </div>

        <div class="card">
          <h3>Stat Card 2</h3>
          <p>More component structure data.</p>
        </div>

        <div class="card">
          <h3>Stat Card 3</h3>
          <p>Responsive interface stats.</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>Footer Content Area</p>
    </footer>
  </div>
</body>
</html>
